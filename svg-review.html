<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Illustrations Review — JFT-Basic CBT</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP","Noto Sans Bengali",sans-serif;background:#f1f5f9;color:#0f172a;padding:16px 16px 90px}
.wrap{max-width:1100px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;background:#fff;padding:14px 18px;border-radius:14px;border:1px solid #cbd5e1}
input,textarea{font-family:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;box-sizing:border-box}
#q{min-width:210px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:2px solid #cbd5e1;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:6px}
.card.flagged{border-color:#dc2626;background:#fef2f2}
.card svg{width:180px;height:140px;max-width:100%;margin:0 auto}
.jp{font-size:17px;font-weight:800;color:#0f766e}
.bn{font-size:13px;color:#334155;font-weight:600}
.key{font-size:11px;color:#64748b;font-family:monospace}
.att-btn{margin-top:4px;padding:7px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;color:#334155;font-weight:700;font-size:12px;cursor:pointer}
.att-btn.on{background:#dc2626;border-color:#dc2626;color:#fff}
.hide{display:none!important}
.note-in{width:100%;margin-top:4px;background:#fff;resize:vertical;min-height:46px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:10px;background:#0f766e;color:#fff;text-decoration:none;font-weight:700;font-size:13px;border:0;cursor:pointer}
.btn.sec{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.summary-box{margin-top:22px;background:#fff;border:2px solid #0f766e;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(15,23,42,.08)}
.summary-box textarea{width:100%;min-height:130px;margin-top:8px;font-family:monospace;font-size:13px;background:#f8fafc}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <h2 style="margin:0">SVG Illustrations Review (<span id="cnt">0</span>)</h2>
      <div style="font-size:13px;color:#64748b">Je chobi-ta thik kora lagbe shetay <b>Need Attention</b> diye niche likho, tarpor shobar niche theke Copy koro</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="q" placeholder="Search (e.g. clean, 電車, গরম)...">
      <a class="btn" href="index.html">← Back to Mock App</a>
    </div>
  </div>
  <div id="grid" class="grid">Loading...</div>

  <div class="summary-box" id="summaryBox">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">Need Attention List (<span id="attCnt">0</span> selected)</h3>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn sec" id="clearAttBtn">Clear All</button>
        <button type="button" class="btn" id="copyAttBtn">📋 Copy All Feedback</button>
      </div>
    </div>
    <textarea id="attOut" readonly placeholder="Ekhono kono chobi 'Need Attention' mark kora hoyni..."></textarea>
  </div>
</div>
<script>
const META={
  hot:["あつい (暑い)","গরম"],cold:["さむい (寒い)","ঠান্ডা"],rain:["あめ (雨) / 雨が降ります","বৃষ্টি"],
  snow:["ゆき (雪) / 雪が降ります","তুষারপাত / বরফ"],turn_right:["みぎに まがる (右に曲がる)","ডান দিকে ঘোরা"],
  turn_left:["ひだりに まがる (左に曲がる)","বাম দিকে ঘোরা"],straight:["まっすぐ いく (まっすぐ行く)","সোজা যাওয়া"],
  fever:["ねつ (熱)","জ্বর"],medicine:["くすり (薬)","ওষুধ"],laugh:["わらう (笑う)","হাসা"],
  sing:["うたう (歌う)","গান গাওয়া"],sleep:["ねる (寝る)","ঘুমানো"],eat:["たべる (食べる)","খাওয়া"],
  drink:["のむ (飲む)","পান করা"],bicycle:["じてんしゃ (自転車)","সাইকেল"],train:["でんしゃ (電車)","ট্রেন"],
  wallet:["さいふ (財布)","মানিব্যাগ"],hospital:["びょういん (病院)","হাসপাতাল"],shopping:["かいもの (買い物)","কেনাকাটা"],
  pray:["おいのり (お祈り) / じんじゃ","প্রার্থনা / মন্দির"],phone:["けいたい / スマホ","মোবাইল ফোন"],
  study:["べんきょう (勉強)","পড়াশোনা"],umbrella:["かさ (傘)","ছাতা"],clock:["とけい (時計)","ঘড়ি"],
  garbage:["ごみ (ゴミ)","ময়লা / আবর্জনা"],camera:["カメラ","ক্যামেরা"],ticket:["きっぷ / チケット","টিকিট"],
  cooking:["りょうり (料理)","রান্না করা"],clean:["そうじ (掃除)","পরিষ্কার করা"],bank:["ぎんこう (銀行)","ব্যাংক"],
  cat:["ねこ (猫)","বিড়াল"],dog:["いぬ (犬)","কুকুর"],fish:["さかな (魚)","মাছ"],
  bread:["パン","পাউরুটি"],apple:["りんご","আপেল"],coffee:["コーヒー","কফি"],
  shirt:["シャツ","শার্ট"],shoes:["くつ (靴)","জুতা"],glasses:["めがね (眼鏡)","চশমা"],
  hat:["ぼうし (帽子)","টুপি"],key:["かぎ (鍵)","চাবি"],map:["ちず (地図)","মানচিত্র / ম্যাপ"],
  letter:["てがみ (手紙)","চিঠি"],newspaper:["しんぶん (新聞)","খবরের কাগজ"],tv:["テレビ","টিভি"],
  computer:["パソコン","কম্পিউটার"],desk:["つくえ (机)","টেবিল / ডেস্ক"],stairs:["かいだん (階段)","সিঁড়ি"],
  park:["こうえん (公園)","পার্ক"],school:["がっこう (学校)","স্কুল"],post_office:["ゆうびんきょく (郵便局)","পোস্ট অফিস"],
  supermarket:["スーパー","সুপারমার্কেট"],restaurant:["レストラン","রেস্টুরেন্ট"],
  car:["くるま (車)","গাড়ি"],bus:["バス","বাস"],airplane:["ひこうき (飛行機)","বিমান"],
  ship:["ふね (船)","জাহাজ"],taxi:["タクシー","ট্যাক্সি"],rice:["ごはん (ご飯)","ভাত"],
  meat:["にく (肉)","মাংস"],egg:["たまご (卵)","ডিম"],tea:["おちゃ (お茶)","চা"],
  water:["みず (水)","পানি"],milk:["ぎゅうにゅう (牛乳)","দুধ"],beer:["ビール","বিয়ার"],
  cake:["ケーキ","কেক"],banana:["バナナ","কলা"],orange:["みかん","কমলা"],
  book:["ほん (本)","বই"],pen:["ペン / えんぴつ","কলম / পেন্সিল"],notebook:["ノート","খাতা / নোটবুক"],
  bag:["かばん","ব্যাগ"],chair:["いす","চেয়ার"],bed:["ベッド","বিছানা"],
  window:["まど (窓)","জানালা"],door:["ドア","দরজা"],sun:["たいよう / はれ","সূর্য / রোদ"],
  moon:["つき (月)","চাঁদ"],mountain:["やま (山)","পাহাড়"],river:["かわ (川)","নদী"],
  sea:["うみ (海)","সমুদ্র"],flower:["はな (花)","ফুল"],tree:["き (木)","গাছ"],
  sakura:["さくら (桜)","সাকুরা ফুল"],fire:["ひ / かじ (火事)","আগুন"],cut:["きる (切る)","কাটা"],
  wash:["あらう (洗う)","ধোয়া"],run:["はしる (走る)","দৌড়ানো"],walk:["あるく (歩く)","হাঁটা"],
  swim:["およぐ (泳ぐ)","সাঁতার কাটা"],read:["よむ (読む)","পড়া"],write:["かく (書く)","লেখা"],
  listen:["きく (聞く)","শোনা"],speak:["はなす (話す)","কথা বলা"],wait:["まつ (待つ)","অপেক্ষা করা"],
  buy:["かう (買う)","কেনা"],pay:["はらう (払う)","টাকা দেওয়া"],gift:["プレゼント / おみやげ","উপহার"],
  bicycle_park:["ちゅうりんじょう (駐輪場)","সাইকেল পার্কিং"],no_smoking:["きんえん (禁煙)","ধূমপান নিষেধ"],
  v_scold:["しかります / おこります","বকা দেওয়া / রাগ করা"],v_think:["かんがえます (考えます)","চিন্তা করা"],
  v_cry:["なきます (泣きます)","কান্না করা"],v_dance:["おどります (踊ります)","নাচা"],
  v_yawn:["あくびを します","হাই তোলা"],v_wake:["おきます (起きます)","ঘুম থেকে ওঠা"],
  v_brush:["はを みがきます (歯を磨きます)","দাঁত মাজা"],v_wear:["きます (着ます)","জামা পরা"],
  v_takeoff:["ぬぎます (脱ぎます)","জুতা/কাপড় খোলা"],v_open:["あけます (開けます)","খোলা"],
  v_close:["しめます (閉めます)","বন্ধ করা"],v_turnon:["つけます","লাইট অন করা"],
  v_turnoff:["けします (消します)","লাইট অফ করা"],v_push:["おします (押します)","ধাক্কা দেওয়া / চাপা"],
  v_pull:["ひきます (引きます)","টানা"],v_carry:["もちます / はこびます","বহন করা"],
  v_drop:["おとします (落とします)","ফেলে দেওয়া"],v_pickup:["ひろいます (拾います)","কুড়িয়ে তোলা"],
  v_throw:["すてます (捨てます)","ময়লা ফেলা"],v_cross:["わたります (渡ります)","রাস্তা পার হওয়া"],
  v_climb:["のぼります (登ります)","সিঁড়ি/উপরে ওঠা"],v_lineup:["ならびます (並びます)","লাইনে দাঁড়ানো"],
  v_bow:["おじぎを します","মাথা নত করে অভিবাদন"],v_handwash:["てを あらいます (手を洗います)","হাত ধোয়া"],
  v_takephoto:["しゃしんを とります","ছবি তোলা"]
};
const STORE='jft_svg_feedback_v1';
let fb={};
try{fb=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){fb={}}
const saveFb=()=>{try{localStorage.setItem(STORE,JSON.stringify(fb))}catch(e){}};
let SVGS={},keys=[];

function updateSummary(){
  const lines=[];
  for(const k of keys){
    const item=fb[k];
    if(item&&item.on){
      const [jp,bn]=META[k]||[k,''];
      const note=(item.note||'').trim()||'Detail/clarity improve korte hobe';
      lines.push(`- ${k} (${jp} / ${bn}): ${note}`);
    }
  }
  document.getElementById('attCnt').textContent=lines.length;
  document.getElementById('attOut').value=lines.join('\n');
}

function render(){
  const s=document.getElementById('q').value.trim().toLowerCase();
  const list=keys.filter(k=>{
    const [jp,bn]=META[k]||['',''];
    return !s||k.includes(s)||jp.toLowerCase().includes(s)||bn.toLowerCase().includes(s);
  });
  document.getElementById('cnt').textContent=list.length;
  document.getElementById('grid').innerHTML=list.map(k=>{
    const [jp,bn]=META[k]||[k,'—'];
    const on=!!(fb[k]&&fb[k].on);
    const note=(fb[k]&&fb[k].note)||'';
    return `<div class="card${on?' flagged':''}" data-k="${k}">
      ${SVGS[k]}
      <div class="jp">${jp}</div>
      <div class="bn">${bn}</div>
      <div class="key">key: ${k}</div>
      <button type="button" class="att-btn${on?' on':''}" data-k="${k}">${on?'⚠ Need Attention (Marked)':'Need Attention'}</button>
      <textarea class="note-in${on?'':' hide'}" data-k="${k}" placeholder="Ki fix korte hobe likho...">${note.replace(/</g,'&lt;')}</textarea>
    </div>`;
  }).join('');

  document.querySelectorAll('.att-btn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(!fb[k])fb[k]={on:false,note:''};
    fb[k].on=!fb[k].on;
    saveFb();render();updateSummary();
  });
  document.querySelectorAll('.note-in').forEach(t=>t.oninput=()=>{
    const k=t.dataset.k;
    if(!fb[k])fb[k]={on:true,note:''};
    fb[k].note=t.value;
    saveFb();updateSummary();
  });
  updateSummary();
}

document.getElementById('copyAttBtn').onclick=async()=>{
  const v=document.getElementById('attOut').value.trim();
  if(!v)return alert('Age kono chobite Need Attention mark koro!');
  try{
    await navigator.clipboard.writeText(v);
    document.getElementById('copyAttBtn').textContent='✓ Copied!';
    setTimeout(()=>document.getElementById('copyAttBtn').textContent='📋 Copy All Feedback',2200);
  }catch(e){
    document.getElementById('attOut').select();
    document.execCommand('copy');
  }
};
document.getElementById('clearAttBtn').onclick=()=>{
  if(!confirm('Sob Need Attention mark o note clear korba?'))return;
  fb={};saveFb();render();
};
document.getElementById('q').oninput=render;

(async()=>{
  const html=await (await fetch('index.html?v='+Date.now())).text();
  const m=html.match(/const SVGS=(\{[\s\S]*?\});/);
  SVGS=m?eval('('+m[1]+')'):{};
  keys=Object.keys(SVGS);
  render();
})();
</script>
</body>
</html>
